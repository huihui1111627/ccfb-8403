<!doctype html>
<html lang="zh">
<head>
<meta charset="utf-8">
<title>风电数据湖</title>
<style>
  :root { --bd:#d8dee4; --bg:#f6f8fa; --ac:#0969da; }
  * { box-sizing: border-box; }
  body { font-family: -apple-system, "PingFang SC", sans-serif; margin:0; color:#1f2328; }
  nav { background:#0d2137; padding:0 20px; display:flex; gap:4px; }
  nav a { color:#c9d6e2; text-decoration:none; padding:12px 16px; display:block; font-size:14px; }
  nav a.active, nav a:hover { color:#fff; background:#1b3a5c; }
  nav .brand { color:#fff; font-weight:700; padding:12px 16px 12px 0; }
  main { max-width:1200px; margin:20px auto; padding:0 20px; }
  .card { background:#fff; border:1px solid var(--bd); border-radius:8px; padding:16px 20px; margin-bottom:16px; }
  .msg { background:#dafbe1; border:1px solid #2da44e; border-radius:6px; padding:8px 14px; margin-bottom:14px; font-size:14px; }
  table { border-collapse:collapse; width:100%; font-size:13px; }
  th, td { border:1px solid var(--bd); padding:5px 9px; text-align:left; white-space:nowrap; }
  th { background:var(--bg); }
  input, select, textarea, button { font-size:13px; padding:5px 8px; border:1px solid var(--bd); border-radius:6px; }
  button { background:var(--ac); color:#fff; border:none; cursor:pointer; padding:6px 14px; }
  button.ghost { background:#fff; color:var(--ac); border:1px solid var(--ac); }
  textarea { width:100%; font-family:ui-monospace, monospace; }
  .row { display:flex; gap:10px; align-items:center; flex-wrap:wrap; margin:8px 0; }
  .ok { color:#1a7f37; } .bad { color:#cf222e; font-weight:600; }
  h2 { margin-top:0; font-size:17px; } h3 { font-size:14px; }
  .mono { font-family:ui-monospace, monospace; font-size:12px; }
  .scroll { overflow-x:auto; }
</style>
</head>
<body>
<nav>
  <span class="brand">🌬 风电数据湖</span>
  <a href="/ingest" {% if page=='ingest' %}class="active"{% endif %}>数据接入</a>
  <a href="/tables" {% if page=='tables' %}class="active"{% endif %}>表管理</a>
  <a href="/snapshots" {% if page=='snapshots' %}class="active"{% endif %}>快照历史</a>
  <a href="/quality" {% if page=='quality' %}class="active"{% endif %}>数据质量</a>
  <a href="/query" {% if page=='query' %}class="active"{% endif %}>查询</a>
</nav>
<main>
{% if msg %}<div class="msg">{{ msg }}</div>{% endif %}
{% block content %}{% endblock %}
</main>
</body>
</html>
